<div class="overlay" id="overlay"></div>
<aside class="cart-drawer" id="cartDrawer" aria-label="Carrinho de compras">
    <div class="cart-header">
        <h2>O teu carrinho</h2>
        <button class="cart-close" id="closeCart" aria-label="Fechar carrinho">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16M20 4L4 20"/></svg>
        </button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
        <div class="checkout-warning" id="checkoutWarning">
            A Stripe ainda não está configurada. Adiciona a tua STRIPE_SECRET_KEY ao ficheiro .env (vê .env.example).
        </div>
        <div class="cart-subtotal">
            <span>Subtotal</span>
            <span id="cartSubtotal">0,00 €</span>
        </div>
        <p class="cart-note">Envio calculado no checkout.</p>
        <button class="checkout-btn" id="checkoutBtn">
            <span>Finalizar compra</span>
        </button>
        <div class="stripe-note">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Pagamento seguro via Stripe</span>
        </div>
    </div>
</aside>
<div class="toast" id="toast"></div>
