<div class="overlay" id="overlay"></div>
<aside class="cart-drawer" id="cartDrawer" aria-label="Carrinho de compras">
    <div class="cart-header">
        <h2>O teu carrinho</h2>
        <button class="cart-close" id="closeCart" aria-label="Fechar carrinho">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16M20 4L4 20"/></svg>
        </button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
        <p class="cart-note">Vais receber os detalhes de pagamento por email.</p>
        <div class="cart-subtotal">
            <span>Subtotal</span>
            <span id="cartSubtotal">0,00 €</span>
        </div>
        <p class="cart-note">Envio calculado no checkout.</p>
        <button class="checkout-btn" id="checkoutBtn">
            <span>Finalizar compra</span>
        </button>
    </div>
</aside>
<div class="toast" id="toast"></div>
