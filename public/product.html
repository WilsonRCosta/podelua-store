<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Pó de Lua</title>
    <link rel="icon" href="/images/mark.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>

<div id="header-mount"></div>

<main class="container product-detail-wrap">
    <div id="detailLoading">A carregar peça…</div>
    <div class="product-detail" id="productDetail" style="display:none;">
        <div id="detailCarouselMount"></div>
        <div class="detail-info">
            <span class="card-category" id="detailCategory"></span>
            <h1 id="detailName"></h1>
            <p class="card-price" id="detailPrice"></p>
            <div id="detailLongDesc" class="long-desc"></div>
            <div id="detailSwatchesMount"></div>
            <button type="button" id="detailCustomizeBtn" class="customize-trigger" style="display:none;">
                <span class="customize-trigger-text">
                    <strong>Personalizar peça</strong>
                    <small id="detailCustomSummary">Esta peça precisa de ser personalizada</small>
                </span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
            </button>
            <button id="detailAddBtn" class="btn btn-primary">Adicionar ao carrinho</button>
        </div>
    </div>
    <div class="detail-footer-link">
        <a href="/privacy.html">Privacidade e Cookies</a>
    </div>
</main>

<div id="cart-drawer-mount"></div>

<aside class="cart-drawer custom-drawer" id="customDrawer" aria-label="Personalização">
    <div class="cart-header">
        <h2>Personalização</h2>
        <button class="cart-close" id="closeCustom" aria-label="Fechar personalização">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16M20 4L4 20"/></svg>
        </button>
    </div>
    <form class="cart-items" id="detailCustomFieldsMount" novalidate></form>
    <div class="cart-footer">
        <button type="button" class="checkout-btn" id="customConfirmBtn">
            <span>Guardar personalização</span>
        </button>
    </div>
</aside>

<script src="/js/api.js"></script>
<script src="/js/partials.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/pricing.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/drawer.js"></script>
<script src="/js/product.js"></script>
</body>
</html>
