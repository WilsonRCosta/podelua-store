<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pagamento cancelado — Pó de Lua</title>
<link rel="icon" href="/images/mark.png" />
<link rel="stylesheet" href="/css/styles.css" />
<style>
  .confirm-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .confirm-card { max-width: 440px; width: 100%; background: var(--cream-soft); border: 1px solid var(--line); border-radius: 26px; padding: 44px 36px; text-align: center; }
  .confirm-card h1 { font-family: var(--display),serif; font-weight: 500; font-size: 1.8rem; margin: 0 0 10px; }
  .confirm-card p { color: var(--ink-muted); line-height: 1.6; margin: 0 0 26px; }
</style>
</head>
<body>
  <div class="confirm-wrap">
    <div class="confirm-card">
      <h1>Pagamento cancelado</h1>
      <p>Nada foi cobrado. O teu carrinho continua à tua espera.</p>
      <a href="/" class="btn btn-primary" style="width:100%; justify-content:center;">Voltar à loja</a>
    </div>
  </div>
</body>
</html>
